<!DOCTYPE html>
<html>

<head>

<title>
Diabetes Prediction
</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<nav>

<h2>
🩸 Diabetes Prediction System
</h2>

</nav>



<div class="container">


<h1>
Diabetes Disease Prediction
</h1>


<p>
Enter patient health details to predict diabetes risk.
</p>



<form action="/predict_diabetes" method="POST">


<input 
type="number"
name="Pregnancies"
placeholder="Number of Pregnancies"
required>


<input 
type="number"
name="Glucose"
placeholder="Glucose Level"
required>


<input 
type="number"
name="BloodPressure"
placeholder="Blood Pressure"
required>


<input 
type="number"
name="SkinThickness"
placeholder="Skin Thickness"
required>


<input 
type="number"
name="Insulin"
placeholder="Insulin Level"
required>


<input 
type="number"
step="0.1"
name="BMI"
placeholder="BMI"
required>


<input 
type="number"
step="0.01"
name="DiabetesPedigreeFunction"
placeholder="Diabetes Pedigree Function"
required>


<input 
type="number"
name="Age"
placeholder="Age"
required>



<button type="submit">

Predict Diabetes

</button>



</form>


</div>



<footer>

<p>
AI Multiple Disease Prediction System
</p>

</footer>



</body>

</html>
