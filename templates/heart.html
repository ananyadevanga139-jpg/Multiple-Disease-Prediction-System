<!DOCTYPE html>
<html>

<head>

<title>Heart Disease Prediction</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<nav>

<h2>
Heart Disease Prediction
</h2>

</nav>



<div class="container">


<h1>
❤️ Heart Disease Prediction
</h1>


<form action="/predict_heart" method="POST">


<input type="number" name="age" placeholder="Age" required>


<input type="number" name="sex" placeholder="Sex (1=Male, 0=Female)" required>


<input type="number" name="cp" placeholder="Chest Pain Type (0-3)" required>


<input type="number" name="trestbps" placeholder="Resting Blood Pressure" required>


<input type="number" name="chol" placeholder="Cholesterol Level" required>


<input type="number" name="fbs" placeholder="Fasting Blood Sugar (1/0)" required>


<input type="number" name="restecg" placeholder="Rest ECG (0-2)" required>


<input type="number" name="thalch" placeholder="Maximum Heart Rate" required>


<input type="number" name="exang" placeholder="Exercise Angina (1/0)" required>


<input type="number" step="0.1" name="oldpeak" placeholder="Oldpeak" required>


<input type="number" name="slope" placeholder="Slope (0-2)" required>


<input type="number" step="0.1" name="ca" placeholder="Number of vessels (0-3)" required>


<input type="number" name="thal" placeholder="Thal (0-3)" required>



<button type="submit">
Predict Heart Disease
</button>


</form>
<a href="/" class="back-btn">
⬅ Back To Home
</a>

</div>



</body>

</html>
